<script>
"use strict";
/* ============================================================
   REI E RAINHA — RPG 8-BITS ESTILO NES
   Teclado: SETAS/WASD mover | Z / ESPAÇO / ENTER acao/atacar
   Joystick: D-PAD/analogico mover | A atacar | START iniciar
   ============================================================ */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
/* ============================================================
   CONTROLES TOUCH — inserido após definição de cv e ctx
   ============================================================ */
const touchState = {up:false,dn:false,lf:false,rt:false,action:false,start:false};

function layoutMobile(){
  const controlsH = 150;
  const availH = window.innerHeight - controlsH;
  const scale = Math.max(1, Math.floor(Math.min(window.innerWidth/256, availH/240)));
  cv.style.width  = (256*scale)+'px';
  cv.style.height = (240*scale)+'px';
  const gameArea = document.getElementById('gameArea');
  if(gameArea) gameArea.style.height = availH+'px';
}
window.addEventListener('resize', layoutMobile);
window.addEventListener('orientationchange', ()=>setTimeout(layoutMobile,300));

function bindTouchBtn(id, key){
  const el = document.getElementById(id);
  if(!el) return;
  function press(e){ e.preventDefault(); touchState[key]=true; el.classList.add('pressed'); unlockAudio(); }
  function release(e){ e.preventDefault(); touchState[key]=false; el.classList.remove('pressed'); }
  el.addEventListener('touchstart', press,   {passive:false});
  el.addEventListener('touchend',   release, {passive:false});
  el.addEventListener('touchcancel',release, {passive:false});
  el.addEventListener('mousedown',  press);
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
}

// D-pad com swipe contínuo
(function(){
  const dpad = document.getElementById('dpad');
  if(!dpad) return;
  const DIRS = ['up','dn','lf','rt'];
  function idToDir(id){ return {'btn-up':'up','btn-dn':'dn','btn-lf':'lf','btn-rt':'rt'}[id]||null; }
  function clearDpad(){
    DIRS.forEach(d=>{ touchState[d]=false; const el=document.getElementById('btn-'+d); if(el) el.classList.remove('pressed'); });
  }
  dpad.addEventListener('touchmove', e=>{
    e.preventDefault();
    clearDpad();
    for(const t of e.touches){
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(!el) continue;
      const d=idToDir(el.id);
      if(d){ touchState[d]=true; el.classList.add('pressed'); }
    }
  },{passive:false});
  dpad.addEventListener('touchend',   e=>{ e.preventDefault(); if(e.touches.length===0) clearDpad(); },{passive:false});
  dpad.addEventListener('touchcancel',e=>{ e.preventDefault(); clearDpad(); },{passive:false});
})();

bindTouchBtn('btn-up',    'up');
bindTouchBtn('btn-dn',    'dn');
bindTouchBtn('btn-lf',    'lf');
bindTouchBtn('btn-rt',    'rt');
bindTouchBtn('btn-action','action');
bindTouchBtn('btn-start', 'start');
/* ============================================================ */

const P = {

  red:'#d82800', dred:'#881400', orange:'#e45c10', yellow:'#f8b800', cream:'#fce0a8',

  blue:'#0058f8', dblue:'#0000bc', lblue:'#3cbcfc', sky:'#5c94fc',

  brown:'#88500c', dbrown:'#503000', tan:'#c08840',
  skin:'#f8b888'

/* ---------------- CONSTANTES ---------------- */
const TILE=16, COLS=16, ROWS=13, HUD_H=32, PXW=256, PXH=240;
const PLAY_Y = HUD_H;
const HERO_SPEED=72, BAT_SPEED=88, GOB_SPEED=32, FIRE_SPEED=110, VAMP_SPEED=22;
const RESPAWN_MS=120000;

/* ---------------- ENTRADA ---------------- */
const keys={};
let actionPressed=false, startPressed=false;
let prevAction=false, prevStart=false;
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  unlockAudio();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('gamepadconnected',()=>{ unlockAudio(); });

function readInput(){
  let up=keys['arrowup']||keys['w']||touchState.up,
      dn=keys['arrowdown']||keys['s']||touchState.dn,
      lf=keys['arrowleft']||keys['a']||touchState.lf,
      rt=keys['arrowright']||keys['d']||touchState.rt;
  let act=keys['z']||keys[' ']||keys['enter']||touchState.action,
      st=keys['enter']||touchState.start||touchState.action;
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of gps){
    if(!g) continue;
    if(g.buttons[12]&&g.buttons[12].pressed) up=true;
    if(g.buttons[13]&&g.buttons[13].pressed) dn=true;
    if(g.buttons[14]&&g.buttons[14].pressed) lf=true;
    if(g.buttons[15]&&g.buttons[15].pressed) rt=true;
    if(g.axes[0]<-0.4) lf=true; if(g.axes[0]>0.4) rt=true;
    if(g.axes[1]<-0.4) up=true; if(g.axes[1]>0.4) dn=true;
    for(let i=0;i<4;i++) if(g.buttons[i]&&g.buttons[i].pressed){ act=true; unlockAudio(); }
    if(g.buttons[9]&&g.buttons[9].pressed){ st=true; act=true; unlockAudio(); }
  }
  actionPressed = act && !prevAction;
  startPressed = (act||st) && !prevStart;
  prevAction = act; prevStart = (act||st);
  return {up,dn,lf,rt};
}

/* ---------------- AUDIO (chiptune) ---------------- */
let AC=null, masterGain=null, noiseBuf=null;
function initAudioContext(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value=0.18; masterGain.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*1, AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){}
}
function unlockAudio(){
  if(!AC) initAudioContext();
  if(AC && AC.state==='suspended') AC.resume().then(()=>{ if(!music.name) setMusic('title'); });
}
// Tenta iniciar o AudioContext imediatamente ao carregar a página
(function(){
  try{
    initAudioContext();
    if(AC && AC.state==='running'){
      // Navegador permitiu sem interação — agenda música do título
      setTimeout(()=>{ if(!music.name) setMusic('title'); }, 100);
    }
  }catch(e){}
})();
// Escuta qualquer interação para desbloquear e iniciar a música
['click','keydown','touchstart','pointerdown'].forEach(ev=>{
  document.addEventListener(ev, function handler(){
    unlockAudio();
    if(AC && AC.state==='running' && !music.name) setMusic('title');
    document.removeEventListener(ev, handler);
  }, {once:true});
});
function midi(n){ return 440*Math.pow(2,(n-69)/12); }
function tone(freq,t,dur,type,vol,dest){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  const atk=0.008, rel=Math.min(0.08,dur*0.4);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.setValueAtTime(vol,t+Math.max(atk,dur-rel));
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(dest||masterGain);
  o.start(t); o.stop(t+dur+0.03);
}
// voz de melodia com leve vibrato e segundo oscilador (detune) -> mais encorpado
function voiceMel(freq,t,dur,vol){
  if(!AC) return;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.setValueAtTime(vol,t+Math.max(0.01,dur-0.06));
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  g.connect(masterGain);
  const o1=AC.createOscillator(); o1.type='square'; o1.frequency.value=freq;
  const o2=AC.createOscillator(); o2.type='square'; o2.frequency.value=freq; o2.detune.value=7;
  // vibrato sutil
  if(dur>0.28){
    const lfo=AC.createOscillator(), lg=AC.createGain();
    lfo.frequency.value=5.5; lg.gain.value=freq*0.006;
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    lfo.start(t+0.12); lfo.stop(t+dur);
  }
  o1.connect(g); o2.connect(g);
  o1.start(t); o1.stop(t+dur+0.03);
  o2.start(t); o2.stop(t+dur+0.03);
}

function voiceStrings(freq,t,dur,vol){
  if(!AC) return;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.08);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  const o1=AC.createOscillator();
  const o2=AC.createOscillator();
  o1.type='triangle';
  o2.type='triangle';
  o1.frequency.value=freq;
  o2.frequency.value=freq*0.5;
  o1.connect(g);
  o2.connect(g);
  g.connect(masterGain);
  o1.start(t); o2.start(t);
  o1.stop(t+dur);
  o2.stop(t+dur);
}
function noiseHit(t,dur,vol,freq){
  if(!AC) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||1200;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t+dur+0.05);
}
// percussao chiptune leve
function drumHit(t,kind){
  if(!AC) return;
  if(kind==='kick'){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.16);
  } else if(kind==='hat'){
    noiseHit(t,0.04,0.06,7000);
  } else if(kind==='snare'){
    noiseHit(t,0.09,0.12,3000);
  }
}

/* --- musicas ---

const music={ song:null, name:null, melIdx:0, bassIdx:0, arpIdx:0, drumIdx:0, melT:0, bassT:0, arpT:0, drumT:0, timer:null, muted:false };
function setMusic(name){
  if(music.name===name) return;
  music.name=name;
  music.song = name?SONGS[name]:null;
  music.melIdx=0; music.bassIdx=0; music.arpIdx=0; music.drumIdx=0;
  if(AC){ const t=AC.currentTime; music.melT=t; music.bassT=t; music.arpT=t; music.drumT=t; }
}
function musicTick(){
  if(!AC || !music.song || music.muted) return;
  const s=music.song, beat=60/s.tempo, ahead=AC.currentTime+0.3;
  // melodia (voz encorpada)
  while(music.melT<ahead){
    const [n,b]=s.mel[music.melIdx%s.mel.length];
    if(n>0) voiceMel(midi(n),music.melT,Math.min(b*beat*0.92,0.7),0.15);
    music.melT+=b*beat; music.melIdx++;
  }
  // baixo
  while(music.bassT<ahead){
    const [n,b]=s.bass[music.bassIdx%s.bass.length];
    if(n>0){ tone(midi(n),music.bassT,b*beat*0.9,'triangle',0.30);
             tone(midi(n),music.bassT,b*beat*0.5,'square',0.05); }
    music.bassT+=b*beat; music.bassIdx++;
  }
  // arpejo / harmonia
  if(s.arp) while(music.arpT<ahead){
    const [n,b]=s.arp[music.arpIdx%s.arp.length];
    if(n>0) tone(midi(n),music.arpT,Math.min(b*beat*0.7,0.18),'square',0.055);
    music.arpT+=b*beat; music.arpIdx++;
  }
  // bateria (1 simbolo por beat)
  if(s.drums) while(music.drumT<ahead){
    const ch=s.drums[music.drumIdx%s.drums.length];
    if(ch==='k') drumHit(music.drumT,'kick');
    else if(ch==='s'){ drumHit(music.drumT,'snare'); drumHit(music.drumT,'kick'); }
    else if(ch==='h') drumHit(music.drumT,'hat');
    music.drumT+=beat; music.drumIdx++;
  }
}

/* ---------------- ESTADO ---------------- */
let state='title';   // title | play | dialog | dying | gameover | ending
let titleBlink=0;
let dyingTimer=0;    // tempo restante no estado 'dying' antes do game over
const flags={
  hasSword:false, hasBlueSword:false, hasKey:false, hasCross:false,
  crossDelivered:false, bossDefeated:false, castleUnlocked:false,
  padreCourageSaid:false, padreBlueSaid:false, gameEnded:false
};
const player={ x:7.5*TILE, y:8*TILE, w:12, h:12, dir:'down', hp:3, maxhp:3,
  invuln:0, attackT:0, walkAnim:0, kbx:0, kby:0, kbT:0 };

const roomState={};  // estado persistente por sala
let cur=null, curName='';
let stairLockT=0;
let gameOverSel=0;   // 0 = SIM, 1 = NAO
let gameOverPhase=0; // 0 = mensagem inicial, 1 = seleção
let goNavLock=false;
let projectiles=[], particles=[], floats=[];
let dialog=null;

function initRoomState(name){
  if(roomState[name]) return roomState[name];
  const def=ROOMS_DEF[name];
  const rs={
    enemies: def.enemies.map(e=>({...e, x:e.ox, y:e.oy, hp:hpFor(e.type), dead:false, deadAt:0,
      t:Math.random()*2, phase:'idle', ang:Math.random()*6.28, fireT:0, batT:0, visT:0, flinch:0 })),
    blocks: def.blocks?def.blocks.map(b=>({x:b.x,y:b.y})):[],
    puzzleSolved:false, rewardTaken:false, clearDone:false,
    bushCut:false, keyTaken:false, items:[], stairRevealed:false
  };
  roomState[name]=rs;
  return rs;
}
function hpFor(t){ return t==='bat'?2 : t==='goblin'?2 : t==='wizard'?1 : t==='vampire'?9 : 1; }

function enterRoom(name, sx, sy){
  curName=name;
  cur=ROOMS_DEF[name];
  initRoomState(name);
  player.x=sx*TILE; player.y=sy*TILE;
  player.invuln=1.0; player.attackT=0; player.kbT=0;
  stairLockT=0.4;
  projectiles=[]; particles=[];
  // respawn check
  const rs=roomState[name];
  const now=performance.now();
  for(const e of rs.enemies){
    if(e.dead && !flags.bossDefeated && e.type!=='vampire' && now-e.deadAt>RESPAWN_MS){
      e.dead=false; e.hp=hpFor(e.type); e.x=e.ox; e.y=e.oy; e.phase='idle'; e.t=0;
      // nao reaparecer em cima do heroi
      if(Math.hypot(e.x-player.x,e.y-player.y)<50){ e.x=(e.x+80)%(COLS*TILE-32)+16; }
    }
    if(flags.bossDefeated) e.dead=true;
  }
  if(flags.hasCross || flags.crossDelivered) setMusic(null);
  else setMusic(cur.music);
}

/* ---------------- COLISAO ---------------- */
function tileAt(tx,ty){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return '#';
  return MAPS[cur.map][ty][tx];
}
function solidChar(c){
  if(c==='#'||c==='w'||c==='W'||c==='R'||c==='A'||c==='C'||c==='h') return true;
  if(c==='T') return !cur.forest;       // arvores na floresta nao colidem
  if(c==='L') return true;
  return false;
}
function rectSolid(x,y,w,h,rs){
  const x1=Math.floor(x/TILE), y1=Math.floor(y/TILE),
        x2=Math.floor((x+w-1)/TILE), y2=Math.floor((y+h-1)/TILE);
  for(let ty=y1;ty<=y2;ty++) for(let tx=x1;tx<=x2;tx++){
    if(solidChar(tileAt(tx,ty))) return true;
  }
  // blocos
  if(rs) for(const b of rs.blocks){
    if(x < b.x*TILE+TILE && x+w > b.x*TILE && y < b.y*TILE+TILE && y+h > b.y*TILE) return true;
  }
  // npcs solidos
  if(cur.npcs) for(const n of cur.npcs){
    if(x < n.x+14 && x+w > n.x+2 && y < n.y+15 && y+h > n.y+4) return true;
  }
  // arbusto solido enquanto nao cortado
  if(cur.bush && rs && !rs.bushCut){
    const b=cur.bush;
    if(x < b.x*TILE+TILE && x+w > b.x*TILE && y < b.y*TILE+TILE && y+h > b.y*TILE) return true;
  }
  return false;
}
function moveEntity(e,dx,dy,rs){
  if(dx!==0){ if(!rectSolid(e.x+dx,e.y,e.w||12,e.h||12,rs)) e.x+=dx; }
  if(dy!==0){ if(!rectSolid(e.x,e.y+dy,e.w||12,e.h||12,rs)) e.y+=dy; }
  if(e===player){
    e.x=Math.max(-6,Math.min(COLS*TILE-6,e.x));
    e.y=Math.max(-6,Math.min(ROWS*TILE-6,e.y));
  }
}
function overlap(a,b,aw,ah,bw,bh){
  return a.x < b.x+bw && a.x+aw > b.x && a.y < b.y+bh && a.y+ah > b.y;
}

/* ---------------- DIALOGO ---------------- */
function say(lines, onDone){
  dialog={pages:Array.isArray(lines)?lines:[lines], idx:0, char:0, onDone:onDone||null};
  state='dialog';
}
function wrapText(t,max){
  const words=t.split(' '), out=[]; let line='';
  for(const w of words){
    if((line+' '+w).trim().length>max){ out.push(line.trim()); line=w; }
    else line+=' '+w;
  }
  if(line.trim()) out.push(line.trim());
  return out;
}

function talkPadre(){
  if(flags.hasCross && !flags.crossDelivered){
    flags.crossDelivered=true; flags.hasCross=false;
    setMusic(null);
    say(["PARABENS, MEU JOVEM! VOCE E CORAJOSO!",
          "VOCE E REALMENTE O REI!",
          "OBRIGADO POR TRAZER A CRUZ SAGRADA DE VOLTA.",
         "AGORA SEU REINO ESTARA EM PAZ! PROCURE SUA RAINHA."]);
    return;
  }
  if(flags.crossDelivered){
    say("PROCURE SUA RAINHA."); return;
  }
  if(flags.hasBlueSword && !flags.padreBlueSaid){
    flags.padreBlueSaid=true;
    say("ESSA ESPADA E MUITO PODEROSA."); return;
  }
  if(flags.hasKey){
    say("DERROTE O VAMPIRAO!"); return;
  }
  if(flags.hasSword && !flags.padreCourageSaid){
    flags.padreCourageSaid=true;
    say(["DIZEM QUE HA UMA CHAVE ESCONDIDA NA FLORESTA."]); return;
  }
  if(flags.hasSword){
    say("VOCE E CORAJOSO. DERROTE O VAMPIRAO!"); return;
  }
  say(["A CRUZ SAGRADA FOI ROUBADA PELO PERIGOSO VAMPIRAO.",
       "PRECISAMOS DE UM JOVEM CORAJOSO PARA NOS AJUDAR.",
       "DIZEM QUE HA UMA ESPADA ESCONDIDA NA IGREJA."]);
}
function talkRainha(){
  if(flags.crossDelivered){
    say("AGORA PODEREMOS VIVER FELIZES EM NOSSO REINO COM NOSSA FAMILIA!",
      ()=>{ flags.gameEnded=true; sfxFanfare(); state='ending'; });
    return;
  }
  if(flags.hasCross){ say("FALE COM O PADRE."); return; }
  say("QUERIDO, PRECISAMOS RECUPERAR A CRUZ SAGRADA E PROTEGER NOSSO REINO.");
}

/* ---------------- ATUALIZACAO ---------------- */
let lastT=performance.now();

function update(dt){
  const inp=readInput();
  const rs=roomState[curName];
  const now=performance.now();
  if(stairLockT>0) stairLockT-=dt;

  /* respawn em tempo real */
  if(!flags.bossDefeated) for(const e of rs.enemies){
    if(e.dead && e.type!=='vampire' && now-e.deadAt>RESPAWN_MS){
      if(Math.hypot(e.ox-player.x,e.oy-player.y)>60){
        e.dead=false; e.hp=hpFor(e.type); e.x=e.ox; e.y=e.oy; e.phase='idle'; e.t=0;
      }
    }
  }

  /* ---- jogador ---- */
  if(player.kbT>0){
    player.kbT-=dt;
    moveEntity(player, player.kbx*dt, player.kby*dt, rs);
  } else if(player.attackT<=0){
    let dx=0,dy=0;
    if(inp.lf){dx=-1;player.dir='left';}
    else if(inp.rt){dx=1;player.dir='right';}
    if(inp.up){dy=-1;player.dir='up';}
    else if(inp.dn){dy=1;player.dir='down';}
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    if(dx||dy){
      player.walkAnim+=dt*8;
      // empurrar blocos
      tryPushBlock(dx,dy,rs,dt);
      moveEntity(player, dx*HERO_SPEED*dt, dy*HERO_SPEED*dt, rs);
    }
  }
  if(player.invuln>0) player.invuln-=dt;
  if(player.attackT>0) player.attackT-=dt;

  /* acao */
  if(actionPressed){
    // falar com NPC?
    const npc=npcInFront();
    if(npc){
      if(npc.type==='padre') talkPadre(); else talkRainha();
    } else if(flags.hasSword || flags.hasBlueSword){
      player.attackT=0.22; sfxSwing();
      doSwordHits(rs);
    }
  }
  if(player.attackT>0.1) doSwordHits(rs); // janela do golpe

  /* itens da sala */
  for(let i=rs.items.length-1;i>=0;i--){
    const it=rs.items[i];
    if(overlap(player,it,12,12,14,14)){
      if(it.kind==='heart'){ if(player.hp<player.maxhp){player.hp++; sfxHeart(); rs.items.splice(i,1);} }
      else if(it.kind==='sword'){ flags.hasSword=true; sfxFanfare(); rs.items.splice(i,1);
        say("VOCE ENCONTROU A ESPADA!"); }
      else if(it.kind==='bluesword'){ flags.hasBlueSword=true; sfxFanfare(); rs.items.splice(i,1);
        say("VOCE ENCONTROU A ESPADA AZUL! ELA E MUITO PODEROSA!"); }
      else if(it.kind==='key'){ flags.hasKey=true; sfxPickup(); rs.items.splice(i,1);
        say("VOCE ENCONTROU A CHAVE DO CASTELO!"); }
      else if(it.kind==='cross'){ flags.hasCross=true; sfxFanfare(); setMusic(null); rs.items.splice(i,1);
        say("VOCE RECUPEROU A CRUZ SAGRADA! LEVE-A AO PADRE."); }
    }
  }

  /* portas */
  if(cur.doors) for(const d of cur.doors){
    if(overlap(player,{x:d.x*TILE,y:d.y*TILE},12,12,TILE,TILE)){
      enterRoom(d.target,d.sx,d.sy); return;
    }
  }
  /* porta trancada do castelo */
  if(cur.lockedDoor){
    const L=cur.lockedDoor;
    const dr={x:L.x1*TILE,y:L.y*TILE};
    if(player.y < (L.y+1)*TILE+2 && player.y+12 > L.y*TILE &&
       player.x+12 > L.x1*TILE && player.x < (L.x2+1)*TILE){
      if(flags.castleUnlocked){
        enterRoom(L.target,L.sx,L.sy); return;
      } else if(flags.hasKey){
        flags.castleUnlocked=true; sfxUnlock();
        say("VOCE ABRIU A PORTA DO CASTELO!");
      } else {
        player.y=(L.y+1)*TILE+2;
        if(actionPressed===false && player.invuln<=0){} 
        if(!cur._saidLocked || now-cur._saidLocked>1500){
          cur._saidLocked=now;
          say("ESTA TRANCADO. E PRECISO UMA CHAVE.");
        }
      }
    }
  }
  /* escadas */
  if(stairLockT<=0){
    const allStairs=[];
    if(cur.stairs) allStairs.push(...cur.stairs);
    if(cur.secretStair && rs.stairRevealed) allStairs.push(cur.secretStair);
    if(cur.clearStair && rs.stairRevealed) allStairs.push(cur.clearStair);
    for(const s of allStairs){
      if(overlap(player,{x:s.x*TILE,y:s.y*TILE},12,12,TILE,TILE)){
        sfxStairs(); enterRoom(s.target,s.sx,s.sy); return;
      }
    }
  }
  /* saidas pelas bordas */
  if(cur.exits) for(const ex of cur.exits){
    const ty=Math.floor((player.y+6)/TILE), tx=Math.floor((player.x+6)/TILE);
    if(ex.side==='E' && player.x>COLS*TILE-14 && ty>=ex.from && ty<=ex.to){ enterRoom(ex.target,ex.sx,ex.sy); return; }
    if(ex.side==='W' && player.x<2 && ty>=ex.from && ty<=ex.to){ enterRoom(ex.target,ex.sx,ex.sy); return; }
    if(ex.side==='S' && player.y>ROWS*TILE-14 && tx>=ex.from && tx<=ex.to){ enterRoom(ex.target,ex.sx,ex.sy); return; }
    if(ex.side==='N' && player.y<2 && tx>=ex.from && tx<=ex.to){ enterRoom(ex.target,ex.sx,ex.sy); return; }
  }

  /* enigma das placas */
  if(cur.plates && !rs.puzzleSolved){
    let all=true;
    for(const p of cur.plates){
      if(!rs.blocks.some(b=>b.x===p.x&&b.y===p.y)) all=false;
    }
    if(all){
      rs.puzzleSolved=true; sfxMystery();
      if(cur.puzzleReward==='sword' && !rs.rewardTaken){
        rs.items.push({kind: flags.hasSword?'heart':'sword', x:7.5*TILE, y:3*TILE});
        rs.rewardTaken=true;
      } else if(cur.puzzleReward==='stairs'){
        rs.stairRevealed=true;
      }
    }
  }
  /* recompensa por limpar a sala */
  const alive=rs.enemies.filter(e=>!e.dead).length;
  if(alive===0 && !rs.clearDone){
    if(cur.clearReward==='bluesword' && !flags.hasBlueSword){
      rs.clearDone=true; sfxMystery();
      rs.items.push({kind:'bluesword', x:7.5*TILE, y:6*TILE});
    } else if(cur.clearStair){
      rs.clearDone=true; sfxMystery(); rs.stairRevealed=true;
    }
  }

  /* ---- inimigos ---- */
  for(const e of rs.enemies){
    if(e.dead) continue;
    updateEnemy(e,dt,rs);
    if(e.flinch>0) e.flinch-=dt;
    /* contato com jogador */
    const ew=e.type==='vampire'?22:12, eh=e.type==='vampire'?22:12;
    if(e.type!=='wizard' || e.phase!=='hidden'){
      if(player.invuln<=0 && overlap(player,e,12,12,ew,eh)){
        hurtPlayer(e.x+ew/2, e.y+eh/2);
      }
    }
  }
  separateEnemies(rs);

  /* projeteis */
  for(let i=projectiles.length-1;i>=0;i--){
    const pj=projectiles[i];
    pj.x+=pj.vx*dt; pj.y+=pj.vy*dt; pj.t+=dt;
    if(pj.x<-8||pj.y<-8||pj.x>COLS*TILE+8||pj.y>ROWS*TILE+8 ||
       solidChar(tileAt(Math.floor((pj.x+3)/TILE),Math.floor((pj.y+3)/TILE)))){
      projectiles.splice(i,1); continue;
    }
    if(player.invuln<=0 && overlap(player,pj,12,12,6,6)){
      projectiles.splice(i,1); hurtPlayer(pj.x,pj.y);
    }
  }
  /* particulas */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.t<=0) particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){ floats[i].t-=dt; floats[i].y-=14*dt; if(floats[i].t<=0) floats.splice(i,1); }
}

function npcInFront(){
  if(!cur.npcs) return null;
  let fx=player.x, fy=player.y;
  if(player.dir==='up') fy-=12; if(player.dir==='down') fy+=12;
  if(player.dir==='left') fx-=12; if(player.dir==='right') fx+=12;
  for(const n of cur.npcs){
    if(fx < n.x+16 && fx+12 > n.x && fy < n.y+16 && fy+12 > n.y) return n;
  }
  return null;
}

function tryPushBlock(dx,dy,rs,dt){
  if(!rs.blocks.length) return;
  const sx=Math.sign(dx), sy=Math.sign(dy);
  if(sx&&sy) return;
  const probeX=player.x+sx*3, probeY=player.y+sy*3;
  for(const b of rs.blocks){
    if(probeX < b.x*TILE+TILE && probeX+12 > b.x*TILE &&
       probeY < b.y*TILE+TILE && probeY+12 > b.y*TILE){
      b.pushT=(b.pushT||0)+dt;
      if(b.pushT>0.18){
        b.pushT=0;
        const nx=b.x+sx, ny=b.y+sy;
        if(!solidChar(tileAt(nx,ny)) && !rs.blocks.some(o=>o!==b&&o.x===nx&&o.y===ny)){
          b.x=nx; b.y=ny; sfxPush();
        }
      }
      return;
    }
  }
}

function doSwordHits(rs){
  const dmg=flags.hasBlueSword?2:1;
  let hx=player.x, hy=player.y, hw=14, hh=14;
  if(player.dir==='up'){hy-=13;}
  if(player.dir==='down'){hy+=13;}
  if(player.dir==='left'){hx-=13;}
  if(player.dir==='right'){hx+=13;}
  /* arbusto */
  if(cur.bush && !rs.bushCut){
    const b=cur.bush;
    if(hx < b.x*TILE+TILE && hx+hw > b.x*TILE && hy < b.y*TILE+TILE && hy+hh > b.y*TILE){
      rs.bushCut=true; sfxMystery();
      if(!flags.hasKey && !rs.keyTaken){
        rs.items.push({kind:'key', x:b.x*TILE+1, y:b.y*TILE+1}); rs.keyTaken=true;
      }
      spawnLeaves(b.x*TILE+8,b.y*TILE+8);
    }
  }
  for(const e of rs.enemies){
    if(e.dead || e.flinch>0) continue;
    if(e.type==='wizard' && e.phase==='hidden') continue;
    const ew=e.type==='vampire'?22:12, eh=e.type==='vampire'?22:12;
    if(hx < e.x+ew && hx+hw > e.x && hy < e.y+eh && hy+hh > e.y){
      e.hp-=dmg; e.flinch=0.35;
      const kb=18;
      const ang=Math.atan2(e.y-player.y,e.x-player.x);
      e.x+=Math.cos(ang)*kb*0.4; e.y+=Math.sin(ang)*kb*0.4;
      if(e.hp<=0) killEnemy(e,rs); else sfxEnemyHit();
    }
  }
}

function killEnemy(e,rs){
  e.dead=true; e.deadAt=performance.now();
  if(e.type==='vampire'){
    sfxExplosion(); flags.bossDefeated=true;
    for(const rn in roomState) for(const en of roomState[rn].enemies) en.dead=true;
    spawnExplosion(e.x+11,e.y+11);
    rs.items.push({kind:'cross', x:7.5*TILE, y:6*TILE});
    setMusic(null);
    return;
  }
  sfxEnemyDie();
  spawnPoof(e.x+6,e.y+6);
  if(Math.random()<0.33){
    rs.items.push({kind:'heart', x:e.x, y:e.y});
  }
}

function hurtPlayer(fx,fy){
  player.hp--; player.invuln=1.3; sfxHurt();
  const ang=Math.atan2(player.y+6-fy, player.x+6-fx);
  player.kbx=Math.cos(ang)*140; player.kby=Math.sin(ang)*140; player.kbT=0.15;
  if(player.hp<=0){
    state='dying'; dyingTimer=1.05; setMusic(null); sfxFail();
  }
}

function spawnPoof(x,y){
  for(let i=0;i<8;i++){
    const a=i/8*6.28;
    particles.push({x,y,vx:Math.cos(a)*40,vy:Math.sin(a)*40,t:0.3,c:P.white,s:3});
  }
}
function spawnLeaves(x,y){
  for(let i=0;i<10;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*70,t:0.4,c:P.red,s:3});
  }
}
function spawnExplosion(x,y){
  for(let i=0;i<26;i++){
    const a=Math.random()*6.28, sp=30+Math.random()*90;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0.5+Math.random()*0.5,
      c:[P.orange,P.yellow,P.red,P.white][i%4],s:4});
  }
}

/* ---------------- SEPARACAO ENTRE INIMIGOS ---------------- */
function enemyRadius(e){ return e.type==='vampire'?11:6; }
function separateEnemies(rs){
  const list=rs.enemies.filter(e=>!e.dead && !(e.type==='wizard'&&e.phase==='hidden'));
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const a=list[i], b=list[j];
      const ar=enemyRadius(a), br=enemyRadius(b);
      const acx=a.x+ar, acy=a.y+ar, bcx=b.x+br, bcy=b.y+br;
      let dx=bcx-acx, dy=bcy-acy;
      let dist=Math.hypot(dx,dy);
      const minD=ar+br;
      if(dist<minD){
        if(dist<0.01){ dx=(Math.random()-0.5); dy=(Math.random()-0.5); dist=Math.hypot(dx,dy)||1; }
        const overlap=(minD-dist)/2;
        const ux=dx/dist, uy=dy/dist;
        // morcego e vampiro voam (sem checar parede); demais respeitam colisao
        nudge(a,-ux*overlap,-uy*overlap,rs);
        nudge(b, ux*overlap, uy*overlap,rs);
      }
    }
  }
}
function nudge(e,dx,dy,rs){
  if(e.type==='bat'||e.type==='vampire'){
    e.x=Math.max(4,Math.min(COLS*TILE-16,e.x+dx));
    e.y=Math.max(4,Math.min(ROWS*TILE-16,e.y+dy));
  } else {
    moveEntity(e,dx,0,rs); moveEntity(e,0,dy,rs);
  }
}

/* ---------------- IA DOS INIMIGOS ---------------- */
function updateEnemy(e,dt,rs){
  e.t+=dt;
  if(e.type==='bat'){
    if(e.phase==='idle'||e.phase==='pause'){
      if(e.phase==='idle'){ e.phase='move'; e.t=0;
        e.ang=Math.atan2(player.y-e.y,player.x-e.x)+(Math.random()-0.5);
        e.turn=(Math.random()<0.5?-1:1)*2.4;
      } else if(e.t>2){ e.phase='move'; e.t=0;
        e.ang=Math.atan2(player.y-e.y,player.x-e.x)+(Math.random()-0.5);
        e.turn=(Math.random()<0.5?-1:1)*2.4;
      }
    }
    if(e.phase==='move'){
      e.ang+=e.turn*dt;
      const dx=Math.cos(e.ang)*BAT_SPEED*dt, dy=Math.sin(e.ang)*BAT_SPEED*dt;
      // morcego voa por cima de tudo, mas fica na sala
      e.x=Math.max(4,Math.min(COLS*TILE-16,e.x+dx));
      e.y=Math.max(4,Math.min(ROWS*TILE-16,e.y+dy));
      if(e.t>1.2){ e.phase='pause'; e.t=0; }
    }
  }
  else if(e.type==='goblin'){
    const dx=player.x-e.x, dy=player.y-e.y;
    let mx=0,my=0;
    if(Math.abs(dx)>Math.abs(dy)) mx=Math.sign(dx); else my=Math.sign(dy);
    if(Math.floor(e.t*2)%2===0){ const tmp=mx; if(Math.abs(dx)>2&&Math.abs(dy)>2){ mx=my?0:mx; } }
    moveEntity(e, mx*GOB_SPEED*dt, my*GOB_SPEED*dt, rs);
  }
  else if(e.type==='wizard'){
    if(!e.phase || e.phase==='idle'){ e.phase='visible'; e.visT=0; e.shot=false; }
    e.visT+=dt;
    if(e.phase==='visible'){
      if(!e.shot && e.visT>1.6){
        e.shot=true; sfxFire();
        const ang=Math.atan2(player.y+6-(e.y+6), player.x+6-(e.x+6));
        projectiles.push({x:e.x+5,y:e.y+5,vx:Math.cos(ang)*FIRE_SPEED,vy:Math.sin(ang)*FIRE_SPEED,t:0,kind:'magic'});
      }
      if(e.visT>4){ e.phase='hidden'; e.visT=0; }
    } else if(e.phase==='hidden'){
      if(e.visT>2){
        e.phase='visible'; e.visT=0; e.shot=false;
        // teleporta longe do heroi
        for(let tries=0;tries<24;tries++){
          const tx=1+Math.floor(Math.random()*(COLS-2)), ty=1+Math.floor(Math.random()*(ROWS-2));
          if(!solidChar(tileAt(tx,ty)) && Math.hypot(tx*TILE-player.x,ty*TILE-player.y)>96){
            e.x=tx*TILE+2; e.y=ty*TILE+2; break;
          }
        }
      }
    }
  }
  else if(e.type==='vampire'){
    e.w=22;e.h=22;
    const dx=player.x-e.x-5, dy=player.y-e.y-5;
    const d=Math.hypot(dx,dy)||1;
    const wob=Math.sin(e.t*3)*16;
    moveEntity(e,(dx/d)*VAMP_SPEED*dt + Math.cos(e.t*2)*wob*dt, (dy/d)*VAMP_SPEED*dt, rs);
    e.fireT+=dt; e.batT+=dt;
    if(e.fireT>3.0){
      e.fireT=0; sfxFire();
      const ang=Math.atan2(player.y+6-(e.y+11), player.x+6-(e.x+11));
      projectiles.push({x:e.x+9,y:e.y+9,vx:Math.cos(ang)*100,vy:Math.sin(ang)*100,t:0,kind:'fire'});
    }
    if(e.batT>20){
      e.batT=0;
      const nb={type:'bat',ox:e.x,oy:e.y,x:e.x,y:e.y,hp:2,dead:false,deadAt:0,t:0,phase:'idle',ang:0,flinch:0,spawned:true};
      rs.enemies.push(nb);
    }
  }
}

/* ---------------- DESENHO ---------------- */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function drawTile(c,tx,ty){
  const x=tx*TILE, y=ty*TILE+PLAY_Y;
  const indoor=cur.indoor, castle=cur.castle, dark=cur.dark;
  if(c==='.'){
    if(dark){ px(x,y,16,16,'#181018'); px(x+7,y+7,2,2,'#241a24'); }
    else if(castle){ px(x,y,16,16,'#2c2c34'); px(x,y,16,1,'#383844'); px(x+8,y+8,1,1,'#383844'); }
    else if(indoor){ px(x,y,16,16,P.tan); px(x,y,16,1,P.brown); px(x,y+8,16,1,P.brown); }
    else { px(x,y,16,16,P.grass); if((tx+ty)%2===0){px(x+3,y+4,2,2,P.grass2);px(x+10,y+11,2,2,P.grass2);} }
  }
  else if(c==='#'){ // rocha
    px(x,y,16,16,P.gray); px(x,y,16,2,P.lgray); px(x+1,y+2,3,3,P.lgray);
    px(x,y+13,16,3,P.dgray); px(x+9,y+8,4,4,P.dgray);
  }
  else if(c==='T'){ // arvore
    if(cur.forest||!indoor){ px(x,y,16,16,P.grass); }
    px(x+2,y+1,12,9,P.dgreen); px(x+4,y-1,8,4,P.dgreen);
    px(x+3,y+2,4,3,P.green); px(x+9,y+4,3,3,P.green);
    px(x+6,y+10,4,6,P.dbrown); px(x+6,y+10,2,6,P.brown);
  }
  else if(c==='R'){ px(x,y,16,16,P.dred); px(x,y,16,3,P.red); px(x+4,y+6,2,2,P.red); px(x+10,y+10,2,2,P.red); }
  else if(c==='W'){ px(x,y,16,16,P.cream); px(x,y,16,2,P.lgray); px(x,y+14,16,2,P.tan);
    px(x+2,y+4,3,5,P.dbrown); }
  else if(c==='D'){ // porta
    if(indoor){ px(x,y,16,16,castle?'#2c2c34':P.tan); px(x+2,y,12,16,P.dbrown); px(x+4,y+2,8,14,P.brown); }
    else { px(x,y,16,16,P.cream); px(x+2,y+2,12,14,P.dbrown); px(x+4,y+4,8,12,P.brown); px(x+11,y+9,2,2,P.yellow); }
  }
  else if(c==='A'){ // altar
    px(x,y,16,16,P.lgray); px(x,y,16,3,P.white); px(x,y+13,16,3,P.gray);
  }
  else if(c==='w'){ // parede interna
    const base=castle?'#1a1a22':(dark?'#100a10':P.dbrown);
    const hi=castle?'#34343e':(dark?'#241624':P.brown);
    px(x,y,16,16,base); px(x,y,16,2,hi); px(x+1,y+4,6,3,hi); px(x+9,y+9,6,3,hi);
  }
  else if(c==='h'){ // banco de igreja
    // Chão sob o banco
    px(x,y,16,16,P.tan);
    // Pés do banco (2 pés na frente)
    px(x+2, y+12, 2, 4, P.dbrown);
    px(x+12,y+12, 2, 4, P.dbrown);
    // Assento
    px(x+1, y+8,  14, 3, P.brown);
    px(x+1, y+8,  14, 1, P.tan);   // brilho no topo
    // Encosto (parte traseira, mais alto)
    px(x+1, y+3,  14, 5, P.dbrown);
    px(x+1, y+3,  14, 1, P.brown); // brilho no topo do encosto
    px(x+2, y+4,  3,  3, P.brown); // decoração esquerda
    px(x+11,y+4,  3,  3, P.brown); // decoração direita
  }
  else if(c==='C'){ // muralha do castelo
    px(x,y,16,16,'#50505c'); px(x,y,16,2,'#6c6c7c'); px(x+1,y+4,6,4,'#3a3a44');

function drawRoom(){
  const m=MAPS[cur.map];
  for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<COLS;tx++) drawTile(m[ty][tx],tx,ty);
  const rs=roomState[curName];

  /* placas */
  if(cur.plates) for(const p of cur.plates){
    const x=p.x*TILE, y=p.y*TILE+PLAY_Y;
    px(x+3,y+3,10,10,rs.puzzleSolved?P.yellow:P.dgray);
    px(x+5,y+5,6,6,cur.dark?'#181018':(cur.castle?'#2c2c34':P.tan));
  }
  /* blocos */
  for(const b of rs.blocks){
    const x=b.x*TILE, y=b.y*TILE+PLAY_Y;
    px(x,y,16,16,P.gray); px(x+1,y+1,14,3,P.lgray); px(x+1,y+12,14,3,P.dgray);
    px(x+4,y+5,8,6,P.dgray); px(x+5,y+6,6,4,P.gray);
  }
  /* escadas */
  const allStairs=[];
  if(cur.stairs) allStairs.push(...cur.stairs.map(s=>({...s,vis:true})));
  if(cur.secretStair) allStairs.push({...cur.secretStair,vis:rs.stairRevealed});
  if(cur.clearStair) allStairs.push({...cur.clearStair,vis:rs.stairRevealed});
  for(const s of allStairs){
    if(!s.vis) continue;
    const x=s.x*TILE, y=s.y*TILE+PLAY_Y;
    const isDown = s.dir==='down';
    const frame = isDown ? '#2a3a6a' : '#6a4a18';
    const step  = isDown ? P.lblue  : P.yellow;
    const dark  = isDown ? '#1a2348' : '#3a2810';
    px(x,y,16,16,P.black);
    px(x,y,16,16,frame);
    px(x+1,y+1,14,14,dark);
    for(let i=0;i<4;i++) px(x+2,y+3+i*3,12-i*2,2,step);
  }
  /* arbusto vermelho piscando */
  if(cur.bush && !rs.bushCut){
    const b=cur.bush, x=b.x*TILE, y=b.y*TILE+PLAY_Y;
    const blink=Math.floor(performance.now()/250)%2===0;
    px(x+2,y+4,12,10,blink?P.red:P.dred);
    px(x+4,y+2,8,4,blink?P.red:P.dred);
    px(x+4,y+5,3,3,blink?P.orange:P.red);
    px(x+9,y+8,3,3,blink?P.orange:P.red);
  }
  /* cruz no topo da Igreja (campo1) */
  if(curName==='campo1'){
    // Telhado: colunas 2-6 (tx=2..6), linhas 2-3 (ty=2..3)
    // Centro horizontal: coluna 4 => cx = 4*TILE + 8
    // Topo do telhado: linha 2 => cy começa em PLAY_Y + 2*TILE
    const cx = 4*TILE + 8;            // centro x da Igreja (coluna 4, meio do tile)
    const cy = PLAY_Y + 2*TILE + 1;   // dentro do tile de telhado da linha 2
    // Haste vertical da cruz
    px(cx-1, cy,   3, 11, P.yellow);
    px(cx,   cy+1, 1, 9,  P.white);
    // Travessão horizontal
    px(cx-5, cy+3, 11, 3, P.yellow);
    px(cx-4, cy+4, 9,  1, P.white);
  }
  /* cruz no altar */
  if(curName==='igreja' && flags.crossDelivered){
    drawCross(7.5*TILE+1, 1*TILE+PLAY_Y+1);
  }
  /* itens */
  for(const it of rs.items){
    const fy=Math.sin(performance.now()/200)*1.5;
    if(it.kind==='heart') drawHeart(it.x,it.y+PLAY_Y+fy,false);
    if(it.kind==='sword') drawSwordItem(it.x,it.y+PLAY_Y+fy,P.lgray);
    if(it.kind==='bluesword') drawSwordItem(it.x,it.y+PLAY_Y+fy,P.lblue);
    if(it.kind==='key') drawKey(it.x,it.y+PLAY_Y+fy);
    if(it.kind==='cross') drawCross(it.x,it.y+PLAY_Y+fy);
  }
  /* npcs */
  if(cur.npcs) for(const n of cur.npcs){
    if(n.type==='padre') drawPadre(n.x,n.y+PLAY_Y);
    else drawRainha(n.x,n.y+PLAY_Y);
  }
  /* inimigos */
  for(const e of rs.enemies){
    if(e.dead) continue;
    const flick=e.flinch>0 && Math.floor(performance.now()/60)%2===0;
    if(flick) continue;
    if(e.type==='bat') drawBat(e.x,e.y+PLAY_Y,e.phase==='move');
    if(e.type==='goblin') drawGoblin(e.x,e.y+PLAY_Y);
    if(e.type==='wizard'){
      if(e.phase==='visible'){
        const fade=e.visT>3.4 && Math.floor(performance.now()/100)%2===0;
        if(!fade) drawWizard(e.x,e.y+PLAY_Y);
      }
    }
    if(e.type==='vampire') drawVampire(e.x,e.y+PLAY_Y,e);
  }
  /* projeteis */
  for(const pj of projectiles){
    const c1=pj.kind==='fire'?P.orange:P.purple, c2=pj.kind==='fire'?P.yellow:P.pink;
    px(pj.x,pj.y+PLAY_Y,6,6,c1); px(pj.x+1,pj.y+1+PLAY_Y,3,3,c2);
  }
  /* jogador */
  const blinkP = player.invuln>0 && Math.floor(performance.now()/80)%2===0;
  if(!blinkP) drawHero(player.x,player.y+PLAY_Y);
  /* particulas */
  for(const p of particles) px(p.x,p.y+PLAY_Y,p.s,p.s,p.c);
}

function text(str,x,y,c,scale){
  scale=scale||1; ctx.fillStyle=c;
  str=str.toUpperCase();
  let cx=x;
  for(const ch of str){
    const g=FONT[ch]||FONT['?'];
    for(let ry=0;ry<5;ry++){
      const row=g[ry];
      for(let rx=0;rx<5;rx++){
        if(row[rx]==='1') ctx.fillRect(cx+rx*scale, y+ry*scale, scale, scale);
      }
    }
    cx+=6*scale;
  }
}
function textCenter(str,y,c,scale){
  scale=scale||1;
  const w=str.length*6*scale-scale;
  text(str,(PXW-w)/2,y,c,scale);
}

    text(l.slice(0,take),16,PXH-h+2+i*9,P.white,1);
  }
  const total=lines.join('').length;
  if(shown>=total && Math.floor(performance.now()/300)%2===0){
    text('>',PXW-24,PXH-16,P.white,1);
  }
}

function drawGameOver(){
  px(0,0,PXW,PXH,P.black);
  textCenter('GAME OVER',46,P.red,2);
  const msg=wrapText('VOCE FOI DERROTADO. O VAMPIRAO VENCEU E AS TREVAS TOMARAM CONTA DO SEU REINO.',26);
  msg.forEach((l,i)=>textCenter(l,84+i*11,P.white,1));
  
  if(gameOverPhase===0){
    // Fase 1: mostra apenas mensagem com prompt para continuar
    if(Math.floor(performance.now()/500)%2===0)
      textCenter('APERTE O BOTAO',160,P.gray,1);
  } else {
    // Fase 2: mostra pergunta e opções
    textCenter('TENTAR NOVAMENTE?',150,P.yellow,1);
    const simC = gameOverSel===0?P.white:P.gray;
    const naoC = gameOverSel===1?P.white:P.gray;
    textCenter('SIM',176,simC,1);
    textCenter('NAO',196,naoC,1);
    const cy = gameOverSel===0?176:196;
    text('>',104,cy,P.yellow,1);
  }
}

function drawEnding(){
  px(0,0,PXW,PXH,P.black);
  px(0,150,PXW,90,P.grass);
  for(let i=0;i<12;i++) px((i*29)%PXW,156+(i*13)%70,2,2,P.grass2);
  // heroi e rainha juntos
  const ox=108, oy=120;
  drawHeroAt(ox,oy);
  drawRainhaAt(ox+24,oy);
  drawCross((PXW-14)/2,70);
  drawHeart(ox+14,oy-18,false);
  textCenter('FIM',36,P.yellow,3);
  textCenter('O REINO ESTA EM PAZ',200,P.white,1);
  if(Math.floor(performance.now()/500)%2===0)
    textCenter('OBRIGADO POR JOGAR!',216,P.lgreen,1);
}
function drawHeroAt(x,y){
  px(x+2,y-3,8,3,P.dbrown); px(x+2,y,8,5,P.skin);
  px(x+3,y+1,1,2,P.black); px(x+8,y+1,1,2,P.black);
  px(x+1,y+5,10,6,P.green); px(x+1,y+5,10,1,P.lgreen);
  px(x+2,y+11,3,3,P.dbrown); px(x+7,y+11,3,3,P.dbrown);
}
function drawRainhaAt(x,y){
  px(x+2,y-2,8,2,P.yellow); px(x+2,y-4,2,2,P.yellow); px(x+5,y-4,2,2,P.yellow); px(x+8,y-4,2,2,P.yellow);
  px(x+1,y,10,4,P.brown); px(x+3,y+1,6,4,P.skin);
  px(x+4,y+2,1,1,P.black); px(x+7,y+2,1,1,P.black);
  px(x+1,y+5,10,9,P.pink); px(x+1,y+12,10,2,P.purple);
}

/* ---------------- LOOP ---------------- */
function resetGame(){
  for(const k in roomState) delete roomState[k];
  for(const k in flags) flags[k]=false;
  player.hp=3; player.dir='down'; player.invuln=0; player.attackT=0; player.kbT=0;
  projectiles=[]; particles=[];
  enterRoom('campo1',4,9);
}

function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  readInputGlobal:;
  if(state==='title'){
    readInput();
    drawTitle(dt);
    if(startPressed){ resetGame(); state='play'; }
  }
  else if(state==='play'){
    update(dt);
    px(0,0,PXW,PXH,P.black);
    drawRoom();
    drawHUD();
  }
  else if(state==='dialog'){
    readInput();
    px(0,0,PXW,PXH,P.black);
    drawRoom();
    drawHUD();
    const lines=wrapText(dialog.pages[dialog.idx],28);
    const total=lines.join('').length;
    if(dialog.char<total){
      const before=Math.floor(dialog.char);
      dialog.char+=dt*40;
      if(Math.floor(dialog.char)>before && Math.floor(dialog.char)%3===0) sfxText();
      if(actionPressed) dialog.char=total;
    } else if(actionPressed){
      dialog.idx++;
      dialog.char=0;
      if(dialog.idx>=dialog.pages.length){
        const cb=dialog.onDone; dialog=null;
        state='play';
        if(cb) cb();
      }
    }
    if(dialog) drawDialogBox();
  }
  else if(state==='dying'){
    // Estado intermediário: toca o som de falha e aguarda ~1 segundo antes do Game Over
    readInput();
    dyingTimer-=dt;
    // Continua desenhando a sala (herói já invisível pelo invuln)
    px(0,0,PXW,PXH,P.black);
    drawRoom();
    drawHUD();
    // Tela escurece progressivamente
    const alpha=Math.min(0.8, 1.0 - (dyingTimer/1.05));
    ctx.fillStyle=`rgba(0,0,0,${alpha})`;
    ctx.fillRect(0,0,PXW,PXH);
    if(dyingTimer<=0){
      state='gameover'; gameOverPhase=0; gameOverSel=0; goNavLock=true;
    }
  }
  else if(state==='gameover'){
    const inp=readInput();
    drawGameOver();
    if(gameOverPhase===0){
      // Fase 1: aguardando primeiro apertar de botão
      if(startPressed){
        gameOverPhase=1;
        goNavLock=true;
      }
    } else {
      // Fase 2: navegação e seleção
      if(inp.up||inp.dn){
        if(!goNavLock){ gameOverSel = gameOverSel===0?1:0; goNavLock=true; sfxText(); }
      } else goNavLock=false;
      if(startPressed){
        if(gameOverSel===0){ resetGame(); state='play'; }
        else { state='title'; setMusic('title'); titleBlink=0; }
      }
    }
  }
  else if(state==='ending'){
    readInput();
    drawEnding();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* --- Dimensionar canvas ao carregar --- */
layoutMobile();
</script>
